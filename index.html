<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사토시 가계부</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
body{font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;padding:16px}
input,select,button{font-size:16px;padding:10px;margin:4px 0;width:100%;box-sizing:border-box}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd}
.in{color:#16a34a}.out{color:#dc2626}.err{color:#dc2626}
.del{width:auto;font-size:12px;padding:4px 8px}
.link{background:none;border:none;color:#2563eb;text-decoration:underline}
small{color:#777}
</style>
</head>
<body>
<h2>사토시 가계부</h2>

<div id="authBox">
  <div id="loginView">
    <h3>로그인</h3>
    <input id="lemail" type="email" placeholder="이메일" autocomplete="email">
    <input id="lpw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="login">로그인</button>
    <button id="toSignup" class="link">계정이 없나요? 회원가입</button>
  </div>
  <div id="signupView" style="display:none">
    <h3>회원가입</h3>
    <input id="semail" type="email" placeholder="이메일 (예: abc@gmail.com)" autocomplete="email">
    <input id="spw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="new-password">
    <input id="spw2" type="password" placeholder="비밀번호 확인" autocomplete="new-password">
    <button id="signup">가입하기</button>
    <button id="toLogin" class="link">이미 계정이 있어요? 로그인</button>
  </div>
  <p id="authMsg" class="err"></p>
</div>

<div id="appBox" style="display:none">
  <p><small id="who"></small> <button id="logout" style="width:auto">로그아웃</button></p>
  <p>BTC/KRW: <b id="price">조회 중…</b>
  <button id="refresh" style="width:auto">새로고침</button></p>
  <input id="manual" type="number" placeholder="조회 실패 시 시세 직접 입력 (원)">
  <select id="type"><option value="-1">지출</option><option value="1">수입</option></select>
  <input id="amount" type="number" placeholder="금액 (원)">
  <input id="memo" placeholder="메모">
  <button id="add">기록</button>
  <button id="upload" style="display:none">이 기기의 기존 기록을 계정으로 올리기</button>
  <h3>이번 달 합계: <span id="sum">0</span> sats</h3>
  <div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword,
         createUserWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDAObWm6f2AUm0O9ZLWudbh3p58V6jP4xY",
  authDomain: "satoshi-ledger.firebaseapp.com",
  projectId: "satoshi-ledger",
  storageBucket: "satoshi-ledger.firebasestorage.app",
  messagingSenderId: "1034917340514",
  appId: "1:1034917340514:web:389e1dbfbe19737f43f83b"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const today = () => new Date().toLocaleDateString('sv-SE');
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const legacyItems = () => JSON.parse(localStorage.getItem('items') || '[]');
let price = null, items = [], unsub = null, user = null;

/* ---------- 시세 ---------- */
async function loadPrice(){
  try{
    const r = await fetch('https://api.upbit.com/v1/ticker?markets=KRW-BTC');
    price = (await r.json())[0].trade_price;
    $('price').textContent = price.toLocaleString() + '원';
  }catch(e){
    price = null;
    $('price').textContent = '조회 실패 (수동 입력 사용)';
  }
}

/* ---------- 화면 ---------- */
function render(){
  const ym = today().slice(0,7);
  let sum = 0;
  $('list').innerHTML = items.map(i => {
    if (i.date.startsWith(ym)) sum += i.sats;
    return `<div class="row"><div>${esc(i.memo) || '-'}<br>
      <small>${i.date} · ${i.krw.toLocaleString()}원 @${i.price.toLocaleString()}</small><br>
      <button class="del" data-id="${i.id}">삭제</button></div>
      <div class="${i.sats<0?'out':'in'}">${i.sats.toLocaleString()} sats</div></div>`;
  }).join('');
  $('sum').textContent = sum.toLocaleString();
}

/* ---------- 로그인 / 회원가입 ---------- */
const msg = t => { $('authMsg').textContent = t; };
const showView = v => {
  $('loginView').style.display = v === 'login' ? 'block' : 'none';
  $('signupView').style.display = v === 'signup' ? 'block' : 'none';
  msg('');
};
const errText = e => ({
  'auth/invalid-credential': '이메일 또는 비밀번호가 맞지 않아요',
  'auth/email-already-in-use': '이미 가입된 이메일이에요',
  'auth/weak-password': '비밀번호는 6자 이상이어야 해요',
  'auth/invalid-email': '이메일 형식이 올바르지 않아요'
}[e.code] || e.code);

$('toSignup').onclick = () => showView('signup');
$('toLogin').onclick = () => showView('login');

$('login').onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $('lemail').value.trim(), $('lpw').value); msg(''); }
  catch(e){ msg(errText(e)); }
};

$('signup').onclick = async () => {
  const email = $('semail').value.trim();
  const pw = $('spw').value;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msg('이메일 형식이 올바르지 않아요 (예: abc@gmail.com)');
  if (pw.length < 6) return msg('비밀번호는 6자 이상이어야 해요');
  if (pw !== $('spw2').value) return msg('비밀번호 확인이 일치하지 않아요');
  try { await createUserWithEmailAndPassword(auth, email, pw); msg(''); }
  catch(e){ msg(errText(e)); }
};

$('logout').onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  user = u;
  if (unsub) { unsub(); unsub = null; }
  $('authBox').style.display = u ? 'none' : 'block';
  $('appBox').style.display = u ? 'block' : 'none';
  if (!u) { items = []; render(); showView('login'); return; }
  $('who').textContent = u.email;
  $('upload').style.display = legacyItems().length ? 'block' : 'none';
  const q = query(collection(db, 'users', u.uid, 'entries'), orderBy('createdAt', 'desc'));
  unsub = onSnapshot(q, snap => {
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => alert('데이터를 불러오지 못했어요: ' + err.message));
});

/* ---------- 기록 추가/삭제 ---------- */
$('add').onclick = async () => {
  const p = price || Number($('manual').value);
  const krw = Number($('amount').value);
  if (!p || !krw) return alert('시세와 금액을 확인하세요');
  const sign = Number($('type').value);
  try {
    await addDoc(collection(db, 'users', user.uid, 'entries'), {
      date: today(), krw, price: p,
      sats: sign * Math.round(krw / p * 1e8),
      memo: $('memo').value, createdAt: Date.now()
    });
    $('amount').value = ''; $('memo').value = '';
  } catch(e){ alert('저장 실패: ' + e.message); }
};

$('list').onclick = async e => {
  const id = e.target.dataset.id;
  if (id && confirm('삭제할까요?')) {
    try { await deleteDoc(doc(db, 'users', user.uid, 'entries', id)); }
    catch(err){ alert('삭제 실패: ' + err.message); }
  }
};

/* ---------- 기존(이 기기) 기록 올리기 ---------- */
$('upload').onclick = async () => {
  const old = legacyItems();
  if (!old.length || !confirm(old.length + '건을 계정으로 올릴까요?')) return;
  try {
    for (let i = 0; i < old.length; i++) {
      const o = old[i];
      await addDoc(collection(db, 'users', user.uid, 'entries'), {
        date: o.date, krw: o.krw, price: o.price, sats: o.sats,
        memo: o.memo || '', createdAt: Date.now() + i
      });
    }
    localStorage.setItem('items_uploaded', localStorage.getItem('items'));
    localStorage.removeItem('items');
    $('upload').style.display = 'none';
  } catch(e){ alert('업로드 실패: ' + e.message); }
};

$('refresh').onclick = loadPrice;
loadPrice();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
