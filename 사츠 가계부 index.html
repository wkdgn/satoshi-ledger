<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사토시 가계부</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
body{font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;padding:16px}
input,select,button{font-size:16px;padding:10px;margin:4px 0;width:100%;box-sizing:border-box}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd}
.in{color:#16a34a}.out{color:#dc2626}
small{color:#777}
</style>
</head>
<body>
<h2>사토시 가계부</h2>
<p>BTC/KRW: <b id="price">조회 중…</b>
<button id="refresh" style="width:auto">새로고침</button></p>
<input id="manual" type="number" placeholder="조회 실패 시 시세 직접 입력 (원)">
<select id="type"><option value="-1">지출</option><option value="1">수입</option></select>
<input id="amount" type="number" placeholder="금액 (원)">
<input id="memo" placeholder="메모">
<button id="add">기록</button>
<h3>이번 달 합계: <span id="sum">0</span> sats</h3>
<div id="list"></div>

<script>
const $ = id => document.getElementById(id);
let price = null;
let items = JSON.parse(localStorage.getItem('items') || '[]');
const today = () => new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD (로컬 시간)

async function loadPrice(){
  try{
    const r = await fetch('https://api.upbit.com/v1/ticker?markets=KRW-BTC');
    price = (await r.json())[0].trade_price;
    $('price').textContent = price.toLocaleString() + '원';
  }catch(e){
    price = null;
    $('price').textContent = '조회 실패 (수동 입력 사용)';
  }
}

function render(){
  const ym = today().slice(0,7);
  let sum = 0;
  $('list').innerHTML = items.slice().reverse().map(i=>{
    if(i.date.startsWith(ym)) sum += i.sats;
    return `<div class="row"><div>${i.memo || '-'}<br>
      <small>${i.date} · ${i.krw.toLocaleString()}원 @${i.price.toLocaleString()}</small></div>
      <div class="${i.sats<0?'out':'in'}">${i.sats.toLocaleString()} sats</div></div>`;
  }).join('');
  $('sum').textContent = sum.toLocaleString();
}

$('add').onclick = () => {
  const p = price || Number($('manual').value);
  const krw = Number($('amount').value);
  if(!p || !krw) return alert('시세와 금액을 확인하세요');
  const sign = Number($('type').value);
  items.push({date: today(), krw, price: p,
    sats: sign * Math.round(krw / p * 1e8), memo: $('memo').value});
  localStorage.setItem('items', JSON.stringify(items));
  $('amount').value = ''; $('memo').value = '';
  render();
};
$('refresh').onclick = loadPrice;
loadPrice(); render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
